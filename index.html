<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0d">
<title>DuoLike Web — iPhone Duo 折叠动画 · WebGL 移植版</title>
<meta name="description" content="Cross-platform WebGL port of DuoLikeAnimation: tilt a frosted-glass pane like the iPhone Duo, or unfold a book-style Duo foldable. Android, iOS and desktop.">
<style>.boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#8a8a95;font:15px system-ui;background:#0a0a0d;z-index:10}</style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="boot" id="boot">正在初始化 WebGL…</div>

<div class="brand glass" aria-hidden="true"><b>DuoLike</b><span>Web</span></div>

<canvas id="gl" aria-label="Duo fold effect viewport"></canvas>

<div id="hint" class="hint glass" hidden></div>

<div class="panel" id="panel" hidden>
  <div class="seg glass" role="tablist" aria-label="effect mode">
    <button id="modeTilt" class="active" role="tab" aria-selected="true">磨砂玻璃</button>
    <button id="modeDuo" role="tab" aria-selected="false">Duo 折叠</button>
  </div>

  <button id="btnMotion" class="chip glass accent" hidden>启用体感</button>
  <button id="btnCalibrate" class="chip glass" hidden title="把当前姿态设为零位 / set current pose as zero tilt">校准</button>

  <label id="manualBox" class="chip glass manual" hidden>
    <span>倾斜</span>
    <input id="slider" type="range" min="-80" max="80" step="1" value="0" aria-label="manual tilt degrees">
    <b id="sliderVal">0°</b>
  </label>

  <button id="btnFold" class="chip glass" hidden>展开</button>
  <label id="foldBox" class="chip glass manual" hidden>
    <span>折叠</span>
    <input id="foldSlider" type="range" min="0" max="100" step="1" value="0" aria-label="fold progress percent">
    <b id="foldVal">0%</b>
  </label>

  <label class="chip glass file" title="替换界面内容 / replace the interface texture">
    壁纸
    <input id="file" type="file" accept="image/*">
  </label>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
